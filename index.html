<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>마일드선릉</title>
<style>
:root{
  --ink:#1a1a1a; --bg:#eeedea; --card:#fff; --line:#e4e3df; --line2:#f1f0ec;
  --soft:#8a8a84; --mute:#a0a09a; --hot:#B4512C; --hotbg:#fdf6f3; --ok:#2f7d4f;
  --ab:#D14B4B; --bk:#2E5FA3; --ag:#1F8A70; --ex:#C9A227; --wh:#7E4FA8; --dr:#6b6b66;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;overflow-x:hidden}
body{background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,'Pretendard','Malgun Gothic',sans-serif;
  font-size:14px;line-height:1.5;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
.wrap{max-width:860px;margin:0 auto;padding:0 0 60px}

/* 버튼 */
.btn{font-size:13px;padding:7px 14px;border:1px solid var(--ink);background:#fff;border-radius:5px;cursor:pointer}
.btn:active{transform:translateY(1px)}
.btn.k{background:var(--ink);color:#fff}
.btn.sm{font-size:12px;padding:5px 11px}
.btn.gh{border-color:var(--line);color:var(--soft)}
.btn[disabled]{opacity:.5;cursor:default}

/* 로그인 */
#login{max-width:320px;margin:0 auto;padding:16vh 20px 0}
#login h1{font-size:14px;font-weight:800;letter-spacing:.16em;margin:0 0 26px;text-align:center}
#login input{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:5px;background:#fff;margin-bottom:9px}
#login input:focus{outline:none;border-color:var(--ink)}
#login .btn{width:100%;padding:11px}
#login .alt{text-align:center;margin-top:14px;font-size:12.5px;color:var(--soft)}
#login .alt a{color:var(--ink);cursor:pointer}
#loginMsg{font-size:12.5px;margin:10px 0 0;min-height:18px;line-height:1.6}
#loginMsg.err{color:var(--hot)}

/* 상단 */
.bar{background:#fff;border-bottom:1px solid var(--ink);padding:12px 18px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:20}
.bar .lg{font-size:12px;font-weight:800;letter-spacing:.16em}
.bar .sp{margin-left:auto;display:flex;gap:7px}
.today{background:#fff;border-bottom:1px solid var(--line);padding:14px 18px;display:flex;align-items:flex-end;gap:26px;flex-wrap:wrap}
.today .d{font-size:16px;font-weight:800;letter-spacing:-.3px}
.today .d em{font-style:normal;font-weight:400;color:var(--mute);font-size:12px;margin-left:6px}
.mt{display:flex;align-items:baseline;gap:5px}
.mt b{font-size:17px;font-weight:800;line-height:1}
.mt span{font-size:11.5px;color:var(--soft)}
.mt.hot b{color:var(--hot)}

/* 달력 */
.cal{background:#fff;padding:14px 18px 4px}
.mh{display:flex;align-items:center;gap:10px;margin-bottom:9px}
.mh b{font-size:15px;font-weight:800;min-width:118px}
.mh .nav{display:flex;gap:5px;margin-left:auto}
.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-left:1px solid var(--line);border-top:1px solid var(--line)}
.dow{background:#f7f6f3;font-size:11px;color:var(--soft);text-align:center;padding:5px 0;
  border-right:1px solid var(--line);border-bottom:1px solid var(--line);font-weight:700}
.dow.sat{color:#3a5e94}.dow.sun{color:#a8443a}
.cell{min-height:64px;min-width:0;overflow:hidden;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:4px 5px}
.cell .dn{font-size:11.5px;color:var(--soft)}
.cell.off{background:#fbfaf8}.cell.off .dn{color:#ccc}
.cell.now{background:var(--hotbg)}
.cell.now .dn{color:var(--hot);font-weight:800}
.ev{font-size:11px;border-radius:3px;padding:2px 5px;margin-top:3px;color:#fff;cursor:pointer;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600;min-width:0}
.ev.ex{color:#3d3100}
.ev.blocked{opacity:.5}
.ev.empty{background:#f4f3f0;color:#b5b4af;font-weight:500;cursor:default}
.cv{font-size:11px;margin-top:3px;padding:3px 6px;border-radius:4px;cursor:pointer;font-weight:800;
  background:#FFE8A3;border:1px solid #E0A800;color:#6B4E00;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.cv.done{background:#F2F1ED;border-color:var(--line);color:var(--mute);font-weight:500;
  text-decoration:line-through;text-decoration-color:#c9c8c3}

/* 목록 */
sec{display:block;background:#fff}
.hd{display:flex;align-items:baseline;gap:9px;padding:16px 18px 5px;border-top:1px solid var(--line)}
.hd .t{font-size:13px;font-weight:800}
.hd .h{font-size:11.5px;color:var(--mute)}
.hd .n{margin-left:auto;font-size:11.5px;color:var(--mute)}
.rows{width:100%;border-collapse:collapse}
.rows td{padding:0 18px;height:48px;border-top:1px solid var(--line2);white-space:nowrap;cursor:pointer}
.rows td+td{padding-left:0}
.rows tr:first-child td{border-top:1px solid var(--line)}
.rows tr:active td{background:#f7f6f3}
.rows .gu{font-weight:600}
.rows .gu.none{color:var(--hot);font-weight:500}
.rows .sub{color:var(--soft);font-size:12.5px}
.rows .r{text-align:right;font-weight:600}
.rows .r.none{color:var(--hot);font-weight:500;font-size:12.5px}
.rows tr.gap td{cursor:default;color:var(--soft)}
.empty{padding:22px 18px;color:var(--mute);font-size:12.5px}
.cd{display:inline-block;width:7px;height:7px;border-radius:2px;margin-right:6px;vertical-align:1px}

/* 탭 */
.tabs{display:flex;gap:5px}
.tab{font-size:12.5px;padding:5px 12px;border:1px solid var(--line);border-radius:5px;
  background:#fff;color:var(--soft);cursor:pointer}
.tab.on{background:var(--ink);color:#fff;border-color:var(--ink);font-weight:700}

/* 청소 */
.chk{display:inline-block;width:17px;height:17px;border:1.5px solid var(--ink);border-radius:4px;
  vertical-align:-3px;margin-right:10px;text-align:center;line-height:14px;font-size:12px;color:transparent}
.chk.on{background:var(--ink);color:#fff}
.chk.off{border-color:#c9c8c3}
.rows tr.done td{color:var(--mute)}
.rows tr.done .gu{font-weight:500;text-decoration:line-through;text-decoration-color:#d5d4cf}

/* 수익 */
.mbar{background:#fff;padding:14px 18px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line)}
.mbar b{font-size:15px;font-weight:800;min-width:92px}
.mbar .nav{margin-left:auto;display:flex;gap:5px}
.big{display:flex;background:#fff;border-bottom:1px solid var(--ink)}
.big > div{flex:1;padding:14px 16px;border-left:1px solid var(--line)}
.big > div:first-child{border-left:none;background:#fafaf9}
.big span{display:block;font-size:11.5px;color:var(--mute);margin-bottom:5px}
.big b{font-size:20px;font-weight:800;letter-spacing:-.03em}
.big b.pos{color:var(--ok)}
.big b.neg{color:var(--hot)}
.half{background:#fff;display:grid;grid-template-columns:1fr 1fr;gap:28px;padding:18px}
.lb{font-size:11.5px;color:var(--mute);margin-bottom:6px;font-weight:700;letter-spacing:.04em}
.ln{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-top:1px solid var(--line2);font-size:13px}
.ln:first-child{border-top:none}
.ln .k{color:#6b6b66;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ln .v{font-weight:600;white-space:nowrap}
.ln .v.neg{color:var(--hot)}
.ln .v.zero{color:#c9c8c3;font-weight:500}
.ln.tot{border-top:1px solid var(--ink);margin-top:4px;padding-top:9px;font-weight:800}
.shr{display:grid;grid-template-columns:62px 1fr 46px;align-items:center;gap:9px;padding:3px 0;font-size:12.5px}
.shr i{height:9px;display:block;border-radius:1px;min-width:2px}
.shr .v{text-align:right;color:#6b6b66}
.mini{display:flex;align-items:flex-end;gap:5px;height:66px;margin-top:4px}
.mini > div{flex:1;background:#d9d7d1;border-radius:1px 1px 0 0;position:relative;min-height:2px}
.mini > div.now{background:var(--ink)}
.mini > div.fut{opacity:.45}
.mini em{position:absolute;bottom:-18px;left:0;right:0;text-align:center;font-size:10.5px;color:var(--mute);font-style:normal}
.hint{font-size:11.5px;color:var(--mute);margin-top:26px;line-height:1.6}

/* 하단 */
.foot{background:#fff;border-top:1px solid var(--ink);padding:13px 18px;display:flex;gap:26px;flex-wrap:wrap}
.foot .mm{display:flex;align-items:baseline;gap:6px}
.foot .mm span{font-size:11.5px;color:var(--mute)}
.foot .mm b{font-size:14px;font-weight:700}
.leg{padding:10px 18px 16px;font-size:11.5px;color:var(--soft);display:flex;gap:14px;flex-wrap:wrap;background:#fff}

/* 모달 */
.ov{position:fixed;inset:0;background:rgba(26,26,26,.38);display:none;z-index:50;
  align-items:flex-end;justify-content:center;padding:0}
.ov.on{display:flex}
.sheet{background:#fff;width:100%;max-width:460px;border-radius:14px 14px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom));
  max-height:90vh;overflow:auto}
.sheet h3{font-size:15px;margin:0 0 3px;font-weight:800}
.sheet .sh{font-size:12.5px;color:var(--soft);margin-bottom:15px}
.f{margin-bottom:11px}
.f label{display:block;font-size:11.5px;color:var(--mute);margin-bottom:4px}
.f input,.f select,.f textarea{width:100%;padding:10px 11px;border:1px solid var(--line);border-radius:5px;background:#fff}
.f input:focus,.f select:focus,.f textarea:focus{outline:none;border-color:var(--ink)}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.acts{display:flex;gap:7px;margin-top:16px}
.acts .btn{flex:1;padding:11px}
.acts .btn.del{flex:0 0 auto;border-color:var(--hot);color:var(--hot)}
.msg{font-size:12.5px;margin-top:10px;line-height:1.6;white-space:pre-wrap}
.msg.err{color:var(--hot)}
.feedrow{display:grid;grid-template-columns:78px 1fr;gap:8px;align-items:center;margin-bottom:8px}
.feedrow .nm{font-size:12.5px;font-weight:700}
.feedrow input{padding:8px 10px;font-size:12px}
.fstat{font-size:11px;color:var(--mute);grid-column:2;margin-top:-4px}
.warn{background:var(--hotbg);border-left:3px solid var(--hot);padding:10px 12px;font-size:12px;line-height:1.7;margin-top:14px;border-radius:0 4px 4px 0}

@media (max-width:620px){
  .wrap{padding-bottom:40px}
  /* [2026-10-13] 모바일 달력을 키웠습니다. 목록을 다 뺀 만큼 세로 여유가 생겼습니다. */
  .cell{min-height:76px;padding:4px 3px}
  .ev{font-size:11px;padding:3px 4px;letter-spacing:-.02em;margin-top:4px}
  .cv{font-size:10.5px;padding:3px 4px;letter-spacing:-.02em;margin-top:4px}
  .cal{padding:12px 6px 6px}
  .dow{font-size:11.5px;padding:7px 0}
  .cell .dn{font-size:12px;font-weight:600}
  .cal{padding:12px 10px 4px}
  .today{gap:16px;padding:12px}
  .bar{padding:10px 12px}
  .rows td{padding:0 12px;height:52px;white-space:normal}
  .rows td+td{padding-left:0}
  .hd,.foot,.leg,.empty{padding-left:12px;padding-right:12px}
  .foot{gap:16px}
  .half{grid-template-columns:1fr;gap:20px;padding:14px 12px}
  .big{flex-wrap:wrap}
  .big > div{flex:1 0 50%;border-left:1px solid var(--line);border-top:1px solid var(--line)}
  .big > div:nth-child(-n+2){border-top:none}
  .big > div:nth-child(odd){border-left:none}
  .big b{font-size:18px}
  .mbar{padding:12px}
  .tabs{gap:4px}
  .tab{padding:5px 9px;font-size:12px}
  .bar{flex-wrap:wrap;gap:8px}
  .bar .sp{width:100%;margin-left:0}
  .bar .sp .btn{flex:1}
}
</style>
</head>
<body>

<!-- ───────── 로그인 ───────── -->
<div id="login" style="display:none">
  <h1>마일드선릉</h1>
  <input id="em" type="email" placeholder="이메일" autocomplete="username">
  <input id="pw" type="password" placeholder="비밀번호" autocomplete="current-password">
  <button class="btn k" id="btnLogin">로그인</button>
  <p id="loginMsg"></p>
  <div class="alt">처음이신가요? <a id="btnSignup">계정 만들기</a></div>
</div>

<!-- ───────── 본화면 ───────── -->
<div class="wrap" id="app" style="display:none">
  <div class="bar">
    <span class="lg">마일드선릉</span>
    <span class="tabs">
      <button class="tab on" data-tab="cal">달력</button>
      <button class="tab" data-tab="clean">청소</button>
    </span>
    <span class="sp">
      <button class="btn sm" id="btnSync">채널 동기화</button>
      <button class="btn sm gh" id="btnCfg">설정</button>
    </span>
  </div>

<!-- ═══ 달력 탭 ═══ -->
<div data-pane="cal">
  <div class="today" id="today"></div>

  <div class="cal">
    <div class="mh">
      <b id="monLabel"></b>
      <span class="nav">
        <button class="btn sm gh" id="mPrev">‹</button>
        <button class="btn sm gh" id="mToday">오늘</button>
        <button class="btn sm gh" id="mNext">›</button>
      </span>
    </div>
    <div class="grid" id="grid"></div>
  </div>

  <div class="foot" id="foot"></div>
  <div class="leg">
    <span><i class="cd" style="background:var(--ab)"></i>Airbnb</span>
    <span><i class="cd" style="background:var(--bk)"></i>Booking.com</span>
    <span><i class="cd" style="background:var(--ag)"></i>Agoda</span>
    <span><i class="cd" style="background:var(--ex)"></i>Expedia</span>
    <span><i class="cd" style="background:var(--wh)"></i>Wehome</span>
    <span><i class="cd" style="background:var(--dr)"></i>Direct</span>
  </div>
</div>

<!-- ═══ 청소 탭 ═══ -->
<div data-pane="clean" style="display:none">
  <sec>
    <div class="hd"><span class="t">이번 주</span><span class="h" id="cwRange"></span><span class="n" id="cwN"></span></div>
    <table class="rows"><tbody id="cwRows"></tbody></table>
  </sec>
  <sec>
    <div class="hd"><span class="t">다음 주</span><span class="h" id="cnRange"></span><span class="n" id="cnN"></span></div>
    <table class="rows"><tbody id="cnRows"></tbody></table>
  </sec>
  <sec>
    <div class="hd"><span class="t">이번 달 청소비</span><span class="h" id="cmWho">드릴 금액</span><span class="n" id="cmN"></span></div>
    <table class="rows"><tbody id="cmRows"></tbody></table>
  </sec>
  <div class="leg">청소 건은 <b>퇴실 날짜마다 자동으로</b> 생깁니다. 예약이 취소되면 같이 사라집니다.</div>
</div>

</div>

<!-- ───────── 예약 입력/수정 ───────── -->
<div class="ov" id="ovBk"><div class="sheet">
  <h3 id="bkTitle">예약</h3>
  <div class="sh" id="bkSub"></div>
  <div class="f2">
    <div class="f"><label>입실</label><input id="bIn" type="date"></div>
    <div class="f"><label>퇴실</label><input id="bOut" type="date"></div>
  </div>
  <div class="f"><label>손님 이름</label><input id="bName" placeholder="예: Yuki Tanaka"></div>
  <div class="f"><label>인원</label><input id="bGuests" type="number" min="1" placeholder="2"></div>
  <div class="f2">
    <div class="f"><label>채널</label><select id="bCh">
      <option value="direct">직접예약</option><option value="airbnb">에어비앤비</option>
      <option value="booking">부킹닷컴</option><option value="agoda">아고다</option>
      <option value="expedia">익스피디아</option>
      <option value="wehome">위홈</option><option value="other">기타</option>
    </select></div>
    <div class="f"><label>상태</label><select id="bSt">
      <option value="confirmed">예약</option><option value="blocked">막아둠</option>
      <option value="cancelled">취소</option>
    </select></div>
  </div>
  <div class="f"><label>메모</label><textarea id="bNote" rows="2"></textarea></div>
  <p class="msg" id="bkMsg"></p>
  <div class="acts">
    <button class="btn del" id="bDel" style="display:none">삭제</button>
    <button class="btn" id="bCancel">닫기</button>
    <button class="btn k" id="bSave">저장</button>
  </div>
</div></div>

<!-- ───────── 설정 ───────── -->
<div class="ov" id="ovCfg"><div class="sheet">
  <h3>설정</h3>
  <div class="sh">방 이름과 채널 iCal 주소</div>
  <div class="f2">
    <div class="f"><label>방 이름</label><input id="cRoom" placeholder="예: 선릉룸"></div>
    <div class="f"><label>청소 단가 (원/건)</label><input id="cFee" type="number" min="0" step="1000" placeholder="45000"></div>
  </div>
  <div class="f"><label>청소 담당자</label><input id="cName" placeholder="예: 임여사님"></div>

  <div style="font-size:11.5px;color:var(--mute);margin:16px 0 7px">채널 iCal 주소</div>
  <div id="feeds"></div>

  <div class="warn">
    <b>iCal 로는 날짜만 들어옵니다.</b> 손님 이름·금액·인원은 안 옵니다 — 예약을 눌러 직접 적으세요.<br>
    <b>이 주소는 비밀번호나 마찬가지입니다.</b> 남에게 보내면 제 예약 일정을 전부 볼 수 있습니다.
  </div>

  <p class="msg" id="cfgMsg"></p>
  <div class="acts">
    <button class="btn" id="cLogout">로그아웃</button>
    <button class="btn" id="cClose">닫기</button>
    <button class="btn k" id="cSave">저장</button>
  </div>
</div></div>

<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

const SB_URL  = 'https://ascxzjzbienfijkvfgmd.supabase.co';
const SB_ANON = 'sb_publishable_XwBf5TZTkLiTUcly2IJTng_CC5XnTbY';
const sb = createClient(SB_URL, SB_ANON);

/* ── 공통 ─────────────────────────────────────────── */
const $ = (id) => document.getElementById(id);
const CH = {
  airbnb:{n:'Airbnb',s:'Airbnb',c:'var(--ab)',k:'ab'}, booking:{n:'Booking.com',s:'Booking',c:'var(--bk)',k:'bk'},
  agoda:{n:'Agoda',s:'Agoda',c:'var(--ag)',k:'ag'},  expedia:{n:'Expedia',s:'Expedia',c:'var(--ex)',k:'ex'},
  wehome:{n:'Wehome',s:'Wehome',c:'var(--wh)',k:'wh'},
  direct:{n:'Direct',s:'Direct',c:'var(--dr)',k:'dr'},   other:{n:'Other',s:'Other',c:'var(--dr)',k:'dr'},
};
const chOf = (k) => CH[k] || CH.other;
const DOW = ['일','월','화','수','목','금','토'];
const pad = (n) => String(n).padStart(2,'0');
const ymd = (d) => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse = (s) => { const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d); };
const addD = (s,n) => { const d=parse(s); d.setDate(d.getDate()+n); return ymd(d); };
const md = (s) => `${Number(s.slice(5,7))}/${Number(s.slice(8,10))}`;
const dowOf = (s) => DOW[parse(s).getDay()];
const won = (n) => (n==null||n==='') ? null : Number(n).toLocaleString('ko-KR');
const nights = (a,b) => Math.round((parse(b)-parse(a))/86400000);
const esc = (s) => String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

let USER=null, ROOM=null, FEEDS=[], BKS=[], MON=new Date();
let CLS=[], SET={cleaning_fee:45000}, MMON=new Date(), TAB='cal';
let CLEANER='';
const TODAY = ymd(new Date());
/* 월요일 시작 주의 첫날 */
const monOf = (s) => addD(s, -((parse(s).getDay()+6)%7));

/* ── 로그인 ───────────────────────────────────────── */
function loginMsg(t,err){ const e=$('loginMsg'); e.textContent=t||''; e.className=err?'err':''; }

$('btnLogin').onclick = async () => {
  loginMsg('로그인 중…');
  const { error } = await sb.auth.signInWithPassword({ email:$('em').value.trim(), password:$('pw').value });
  if (error) return loginMsg(error.message.includes('Invalid') ? '이메일 또는 비밀번호가 맞지 않습니다.' : error.message, true);
  loginMsg(''); boot();
};
$('btnSignup').onclick = async () => {
  const email=$('em').value.trim(), password=$('pw').value;
  if (!email || password.length < 8) return loginMsg('이메일을 적고, 비밀번호는 8자 이상으로 해주세요.', true);
  loginMsg('계정 만드는 중…');
  const { error } = await sb.auth.signUp({ email, password });
  if (error) return loginMsg(error.message, true);
  loginMsg('계정을 만들었습니다. 메일함에서 확인 링크를 누른 뒤 로그인하세요.\n(확인 메일이 꺼져 있으면 바로 로그인하시면 됩니다.)');
};
$('pw').addEventListener('keydown', e => { if (e.key==='Enter') $('btnLogin').click(); });

/* ── 데이터 ───────────────────────────────────────── */
async function loadAll(){
  const { data: rooms } = await sb.from('rooms').select('*').order('sort');
  ROOM = rooms?.[0] || null;
  if (!ROOM) {
    const { data } = await sb.from('rooms').insert({ owner_id:USER.id, name:'내 방' }).select().single();
    ROOM = data;
  }
  const { data: feeds } = await sb.from('ical_feeds').select('*').eq('room_id', ROOM.id);
  FEEDS = feeds || [];

  /* 방 1개라 데이터가 적습니다 — 앞뒤 1년을 한 번에 받아두고
     달력·청소·수익 탭이 같은 배열을 나눠 씁니다. (요청 1번으로 끝) */
  const FROM = addD(TODAY, -400), TO = addD(TODAY, 400);
  const { data: bks } = await sb.from('bookings').select('*')
    .neq('status','cancelled')
    .lte('checkin_date', TO).gte('checkout_date', FROM)
    .order('checkin_date');
  BKS = bks || [];

  const { data: cls } = await sb.from('cleanings').select('*')
    .gte('cdate', FROM).lte('cdate', TO).order('cdate');
  CLS = cls || [];

  const { data: st } = await sb.from('settings').select('*').maybeSingle();
  if (st) SET = st;
  else {
    const { data } = await sb.from('settings')
      .insert({ owner_id:USER.id, cleaning_fee:45000 }).select().maybeSingle();
    if (data) SET = data;
  }
  CLEANER = (SET && SET.cleaner_name) || '';
}

/* ── 그리기 ───────────────────────────────────────── */
function render(){
  renderToday(); renderCal(); renderFoot();
  renderClean();
}

/* ── 탭 ───────────────────────────────────────────── */
function setTab(t){
  TAB = t;
  document.querySelectorAll('.tab').forEach(b => b.classList.toggle('on', b.dataset.tab===t));
  document.querySelectorAll('[data-pane]').forEach(p => { p.style.display = (p.dataset.pane===t) ? '' : 'none'; });
  // 「+ 예약 / 채널 동기화」는 달력에서만 의미가 있습니다
  $('btnSync').style.display = (t==='cal') ? '' : 'none';
  window.scrollTo(0,0);
}
document.querySelectorAll('.tab').forEach(b => { b.onclick = () => setTab(b.dataset.tab); });

function nightsOf(b){ const out=[]; for(let d=b.checkin_date; d<b.checkout_date; d=addD(d,1)) out.push(d); return out; }
function byNight(){
  const m={};
  BKS.forEach(b => nightsOf(b).forEach(d => { (m[d]=m[d]||[]).push(b); }));
  return m;
}

function renderToday(){
  const outs = BKS.filter(b=>b.checkout_date===TODAY && b.status==='confirmed');
  const ins  = BKS.filter(b=>b.checkin_date===TODAY && b.status==='confirmed');
  const nm = byNight();
  const stay = (nm[TODAY]||[]).filter(b=>b.status==='confirmed');
  // 이달 남은 빈 밤
  const mEnd = ymd(new Date(parse(TODAY).getFullYear(), parse(TODAY).getMonth()+1, 0));
  let free=0; for(let d=TODAY; d<=mEnd; d=addD(d,1)) if(!(nm[d]||[]).some(b=>b.status==='confirmed')) free++;

  const d = parse(TODAY);
  $('today').innerHTML =
    `<div class="d">${d.getMonth()+1}월 ${d.getDate()}일<em>${DOW[d.getDay()]}요일</em></div>` +
    (outs.length ? `<div class="mt hot"><b>${outs.length}</b><span>오늘 퇴실</span></div>` : '') +
    (ins.length  ? `<div class="mt"><b>${ins.length}</b><span>오늘 입실</span></div>` : '') +
    (!outs.length && !ins.length
      ? `<div class="mt"><b>${stay.length?'숙박중':'빈 방'}</b><span>${stay.length?esc(stay[0].guest_name||'이름 없음'):'오늘 일정 없음'}</span></div>` : '') +
    `<div class="mt"><b>${free}</b><span>이달 남은 빈 밤</span></div>`;
}

function renderCal(){
  const y=MON.getFullYear(), m=MON.getMonth();
  $('monLabel').textContent = `${y}년 ${m+1}월`;
  const first = new Date(y,m,1);
  const start = new Date(y,m,1 - ((first.getDay()+6)%7));   // 월요일 시작
  const nm = byNight();

  let h = ['월','화','수','목','금','토','일'].map((t,i)=>
    `<div class="dow${i===5?' sat':i===6?' sun':''}">${t}</div>`).join('');

  for(let i=0;i<42;i++){
    const d = new Date(start); d.setDate(start.getDate()+i);
    const s = ymd(d);
    if (i>=35 && d.getMonth()!==m) break;
    const off = d.getMonth()!==m;
    const list = nm[s]||[];
    let inner = `<div class="dn">${d.getDate()}${s===TODAY?' · 오늘':''}</div>`;
    if (list.length){
      /* [2026-10-12] 막아둔 날도 채널 색으로 칠합니다.
         전에는 회색 빗금이라 부킹닷컴·위홈이 전부 회색으로만 보였습니다.
         예약과 구분은 색이 아니라 투명도(.5)로 합니다. */
      inner += list.map(b=>{
        const c = chOf(b.channel);
        const blocked = b.status==='blocked';
        const nameTxt = blocked ? ((c.s||c.n) + ' 막음') : (b.guest_name || (c.s||c.n));
        return `<div class="ev ${c.k}${blocked?' blocked':''}" style="background:${c.c};" data-bk="${b.id}">${esc(nameTxt)}</div>`;
      }).join('');
    } else if (!off) {
      inner += `<div class="ev empty">빈 방</div>`;
    }
    /* [2026-10-12] 퇴실일에는 청소를 같은 칸에 같이 보여줍니다.
       탭을 왔다 갔다 하지 않아도 「이 날 청소 있구나」가 바로 보입니다. */
    const cl = CLS.find(c => c.cdate === s);
    if (cl) inner += `<div class="cv${cl.done?' done':''}" data-cl="${cl.id}">${cl.done?'✓ 청소완료':'🧹 청소'}${CLEANER?' · '+esc(CLEANER):''}</div>`;
    h += `<div class="cell${off?' off':''}${s===TODAY?' now':''}">${inner}</div>`;
  }
  $('grid').innerHTML = h;
}

function rowBk(b){
  const c = chOf(b.channel);
  const n = nights(b.checkin_date,b.checkout_date);
  const when = b.checkout_date===TODAY ? '오늘 퇴실'
             : b.checkin_date===TODAY ? '오늘 입실'
             : (b.checkin_date<TODAY && b.checkout_date>TODAY) ? '숙박중'
             : `${dowOf(b.checkin_date)}요일 입실`;
  const name = b.status==='blocked' ? '막아둠'
             : (b.guest_name ? esc(b.guest_name) : '<span class="gu none">이름 적기</span>');
  const amt  = b.amount!=null ? `<td class="r">${won(b.amount)}</td>`
             : (b.status==='blocked' ? '<td class="r"></td>' : '<td class="r none">금액 적기</td>');
  return `<tr data-bk="${b.id}">
    <td class="sub" style="width:92px">${when}</td>
    <td class="gu">${name}</td>
    <td class="sub"><i class="cd" style="background:${c.c}"></i>${c.n}${b.num_guests?' · '+b.num_guests+'명':''}</td>
    <td class="sub">${md(b.checkin_date)}–${md(b.checkout_date)} · ${n}박</td>
    ${amt}</tr>`;
}

function renderFoot(){
  /* [2026-10-13] 금액 표시를 전부 뺐습니다.
     iCal 로는 금액이 안 오고, 손으로 적지 않으면 늘 「—」 였습니다.
     달력에서 바로 쓸모 있는 가동률과 마지막 동기화만 남깁니다. */
  const y=MON.getFullYear(), m=MON.getMonth();
  const mStart = ymd(new Date(y,m,1)), mEnd = ymd(new Date(y,m+1,0));
  const nm = byNight();
  let sold=0, days=0, free=0;
  for(let d=mStart; d<=mEnd; d=addD(d,1)){
    days++;
    if((nm[d]||[]).some(b=>b.status==='confirmed')) sold++; else free++;
  }
  const sync = FEEDS.filter(f=>f.last_sync_at).sort((a,b)=>b.last_sync_at.localeCompare(a.last_sync_at))[0];
  const st = sync ? new Date(sync.last_sync_at).toLocaleString('ko-KR',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'}) : '아직 없음';

  $('foot').innerHTML =
    `<div class="mm"><span>${m+1}월 가동률</span><b>${Math.round(sold/days*100)}%</b></div>` +
    `<div class="mm"><span>빈 밤</span><b>${free}박</b></div>` +
    `<div class="mm"><span>마지막 동기화</span><b style="font-weight:600;font-size:12.5px">${st}</b></div>`;
}

/* ── 청소 탭 ──────────────────────────────────────── */
function cleanRow(c){
  const b = BKS.find(x => x.id === c.booking_id);
  const nextIn = BKS.filter(x => x.checkin_date >= c.cdate && x.status==='confirmed')
                    .sort((a,b2)=>a.checkin_date.localeCompare(b2.checkin_date))[0];
  let sub;
  if (c.done) sub = '완료' + (c.done_at ? ' · ' + new Date(c.done_at).toLocaleDateString('ko-KR',{month:'numeric',day:'numeric'}) : '');
  else if (b && b.guest_name) sub = esc(b.guest_name) + ' 퇴실';
  else sub = '퇴실 후 청소';
  const urgent = nextIn && nextIn.checkin_date === c.cdate;
  const nx = nextIn ? (urgent ? '<b style="color:var(--hot)">같은 날 입실 — 급함</b>' : '다음 입실 ' + md(nextIn.checkin_date)) : '다음 입실 없음';
  return `<tr class="${c.done?'done':''}" data-cl="${c.id}">
    <td style="width:148px"><span class="chk ${c.done?'on':'off'}">✓</span><b>${md(c.cdate)} (${dowOf(c.cdate)})</b></td>
    <td class="gu">${sub}</td>
    <td class="sub">${c.done ? '' : nx}</td>
    <td class="r">${won(c.amount)}</td></tr>`;
}

function renderClean(){
  const w0 = monOf(TODAY), w1 = addD(w0,6), n0 = addD(w0,7), n1 = addD(w0,13);
  const inR = (a,b2) => CLS.filter(c => c.cdate>=a && c.cdate<=b2);
  const sum = (arr) => arr.reduce((s,c)=>s+Number(c.amount||0),0);

  const wk = inR(w0,w1), nx = inR(n0,n1);
  $('cwRange').textContent = `${md(w0)} – ${md(w1)}`;
  $('cnRange').textContent = `${md(n0)} – ${md(n1)}`;
  $('cwN').textContent = wk.length ? `${wk.length}건 · ${won(sum(wk))}원` : '';
  $('cnN').textContent = nx.length ? `${nx.length}건 · ${won(sum(nx))}원` : '';
  $('cwRows').innerHTML = wk.length ? wk.map(cleanRow).join('')
    : `<tr><td colspan="4" class="empty">이번 주는 퇴실이 없습니다.</td></tr>`;
  $('cnRows').innerHTML = nx.length ? nx.map(cleanRow).join('')
    : `<tr><td colspan="4" class="empty">다음 주는 퇴실이 없습니다.</td></tr>`;

  // 이번 달 청소비
  const y=MMON.getFullYear(), m=MMON.getMonth();
  const m0 = ymd(new Date(y,m,1)), m1 = ymd(new Date(y,m+1,0));
  const mo = inR(m0,m1), dn = mo.filter(c=>c.done), td = mo.filter(c=>!c.done);
  $('cmWho').textContent = CLEANER ? (CLEANER + '께 드릴 금액') : '드릴 금액';
  $('cmN').textContent = mo.length ? `${mo.length}건 · ${won(sum(mo))}원` : '0건';
  $('cmRows').innerHTML = mo.length ? [
    dn.length ? `<tr><td class="sub" style="width:148px">완료</td><td class="gu">${dn.length}건</td>
      <td class="sub">${dn.map(c=>md(c.cdate)).join(' · ')}</td><td class="r">${won(sum(dn))}</td></tr>` : '',
    td.length ? `<tr><td class="sub" style="width:148px">예정</td><td class="gu">${td.length}건</td>
      <td class="sub">${td.map(c=>md(c.cdate)).join(' · ')}</td><td class="r">${won(sum(td))}</td></tr>` : '',
  ].join('') : `<tr><td colspan="4" class="empty">이번 달 청소가 없습니다.</td></tr>`;
}

/* 청소 줄을 누르면 완료 ↔ 미완료 */
document.addEventListener('click', async (e) => {
  const t = e.target.closest('[data-cl]');
  if (!t) return;
  const c = CLS.find(x => x.id === t.dataset.cl);
  if (!c) return;
  const now = !c.done;
  const { error } = await sb.from('cleanings')
    .update({ done: now, done_at: now ? new Date().toISOString() : null }).eq('id', c.id);
  if (error) return alert(error.message);
  c.done = now; c.done_at = now ? new Date().toISOString() : null;
  renderClean();
});

/* ── 예약 열기/저장 ───────────────────────────────── */
let EDIT = null;
function openBk(b, presetDate){
  EDIT = b || null;
  const isIcal = b && b.source==='ical';
  $('bkTitle').textContent = b ? '예약 수정' : '새 예약';
  $('bkSub').textContent = isIcal
    ? `${chOf(b.channel).n}에서 자동으로 들어온 예약입니다. 날짜는 채널에서 관리되니 이름·금액만 적으세요.`
    : '';
  $('bIn').value  = b ? b.checkin_date  : (presetDate || TODAY);
  $('bOut').value = b ? b.checkout_date : addD(presetDate || TODAY, 1);
  $('bName').value = b?.guest_name || '';
  $('bGuests').value = b?.num_guests ?? '';
  $('bCh').value = b?.channel || 'direct';
  $('bSt').value = b?.status || 'confirmed';
  $('bNote').value = b?.note || '';
  $('bIn').disabled = $('bOut').disabled = $('bCh').disabled = !!isIcal;
  $('bDel').style.display = b ? '' : 'none';
  $('bkMsg').textContent=''; $('bkMsg').className='msg';
  $('ovBk').classList.add('on');
  setTimeout(()=>$('bName').focus(), 80);
}
const closeBk = () => $('ovBk').classList.remove('on');
$('bCancel').onclick = closeBk;
$('ovBk').onclick = (e)=>{ if(e.target===$('ovBk')) closeBk(); };

$('bSave').onclick = async () => {
  const msg=$('bkMsg'); msg.className='msg'; msg.textContent='저장 중…';
  const ci=$('bIn').value, co=$('bOut').value;
  if (!ci || !co || co<=ci){ msg.className='msg err'; msg.textContent='퇴실 날짜가 입실보다 뒤여야 합니다.'; return; }
  const row = {
    guest_name: $('bName').value.trim() || null,
    num_guests: $('bGuests').value ? Number($('bGuests').value) : null,
    status: $('bSt').value, note: $('bNote').value.trim() || null,
  };
  let err;
  if (EDIT){
    if (EDIT.source !== 'ical'){ row.checkin_date=ci; row.checkout_date=co; row.channel=$('bCh').value; }
    ({ error: err } = await sb.from('bookings').update(row).eq('id', EDIT.id));
  } else {
    ({ error: err } = await sb.from('bookings').insert({
      ...row, owner_id:USER.id, room_id:ROOM.id, channel:$('bCh').value,
      checkin_date:ci, checkout_date:co, source:'manual' }));
  }
  if (err){ msg.className='msg err'; msg.textContent=err.message; return; }
  closeBk(); await loadAll(); render();
};

$('bDel').onclick = async () => {
  if (!EDIT) return;
  if (EDIT.source === 'ical'){
    if (!confirm('채널에서 들어온 예약입니다. 지워도 다음 동기화 때 다시 들어옵니다.\n그래도 지울까요?')) return;
  } else if (!confirm('이 예약을 지울까요?')) return;
  const { error } = await sb.from('bookings').delete().eq('id', EDIT.id);
  if (error){ $('bkMsg').className='msg err'; $('bkMsg').textContent=error.message; return; }
  closeBk(); await loadAll(); render();
};

async function goMon(delta){
  MON = delta===0 ? new Date() : new Date(MON.getFullYear(), MON.getMonth()+delta, 1);
  await loadAll(); render();
}
$('mPrev').onclick = ()=>goMon(-1);
$('mNext').onclick = ()=>goMon(1);
$('mToday').onclick = ()=>goMon(0);

/* ── 동기화 ───────────────────────────────────────── */
async function doSync(){
  const { data: { session } } = await sb.auth.getSession();
  const r = await fetch(`${SB_URL}/functions/v1/ical-sync`, {
    method:'POST', headers:{ 'Authorization':`Bearer ${session.access_token}`, 'Content-Type':'application/json' },
    body:'{}' });
  const j = await r.json();
  if (!r.ok || j.error) throw new Error(j.error || `HTTP ${r.status}`);
  await loadAll(); render();
  return j;
}

$('btnSync').onclick = async () => {
  const b=$('btnSync'); b.disabled=true; const old=b.textContent; b.textContent='동기화 중…';
  try{
    const j = await doSync();
    const parts=[]; if(j.added)parts.push(`새 예약 ${j.added}건`); if(j.updated)parts.push(`변경 ${j.updated}건`); if(j.cancelled)parts.push(`취소 ${j.cancelled}건`);
    alert(parts.length ? parts.join(' · ') : '바뀐 것이 없습니다.');
  }catch(e){ alert('동기화 실패\n'+e.message); }
  b.disabled=false; b.textContent=old;
};

/* 앱을 열었을 때 마지막 동기화가 1시간을 넘었으면 조용히 한 번 당겨옵니다.
   서버가 1시간마다 돌고 있어서 평소엔 할 일이 없지만,
   오래 안 켰다가 열었을 때 옛날 화면을 보는 일을 막아줍니다.
   실패해도 아무 말 안 합니다 — 버튼을 누르면 그때 제대로 알려줍니다. */
async function autoSync(){
  if (!FEEDS.length) return;
  const last = FEEDS.map(f=>f.last_sync_at).filter(Boolean).sort().pop();
  if (last && Date.now() - new Date(last).getTime() < 3600000) return;
  const b=$('btnSync'); const old=b.textContent; b.textContent='동기화 중…';
  try { await doSync(); } catch(e) {}
  b.textContent=old;
}

$('ovCfg').onclick = (e)=>{ if(e.target===$('ovCfg')) closeCfg(); };

$('cSave').onclick = async () => {
  const msg=$('cfgMsg'); msg.className='msg'; msg.textContent='저장 중…';
  const name = $('cRoom').value.trim() || '내 방';
  if (name !== ROOM.name) await sb.from('rooms').update({ name }).eq('id', ROOM.id);

  /* 청소 단가 — 바꾸면 「아직 안 한」 청소 건에만 반영합니다.
     이미 완료한 건은 그때 드린 금액이라 건드리지 않습니다. */
  const fee = $('cFee').value ? Number($('cFee').value) : 45000;
  const who = $('cName').value.trim() || null;
  if (fee !== Number(SET.cleaning_fee) || who !== (SET.cleaner_name || null)) {
    await sb.from('settings').upsert({ owner_id:USER.id, cleaning_fee:fee, cleaner_name:who, updated_at:new Date().toISOString() });
    if (fee !== Number(SET.cleaning_fee)) await sb.from('cleanings').update({ amount: fee }).eq('done', false);
  }

  for (const inp of $('feeds').querySelectorAll('input[data-ch]')){
    const ch = inp.dataset.ch, url = inp.value.trim();
    const f = FEEDS.find(x=>x.channel===ch);
    if (url && !/^https?:\/\//i.test(url)){ msg.className='msg err'; msg.textContent=`${chOf(ch).n} 주소가 http 로 시작하지 않습니다.`; return; }
    if (f && !url)        await sb.from('ical_feeds').delete().eq('id', f.id);
    else if (f && url!==f.url) await sb.from('ical_feeds').update({ url, is_active:true }).eq('id', f.id);
    else if (!f && url)   await sb.from('ical_feeds').insert({ owner_id:USER.id, room_id:ROOM.id, channel:ch, url });
  }
  closeCfg(); await loadAll(); render();
};

$('cLogout').onclick = async () => { await sb.auth.signOut(); location.reload(); };

/* ── 시작 ─────────────────────────────────────────── */
async function boot(){
  const { data:{ session } } = await sb.auth.getSession();
  if (!session){ $('login').style.display='block'; $('app').style.display='none'; return; }
  USER = session.user;
  $('login').style.display='none'; $('app').style.display='block';
  await loadAll(); render(); setTab('cal');
  autoSync();
}
boot();
</script>
</body>
</html>
